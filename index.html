<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenSSL AES Decrypt Checker</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f1f5f9;
  font-family:Arial,sans-serif;
  color:#0f172a
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px
}
.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:16px;
  box-shadow:0 3px 15px #0001
}
h1{margin-top:0}
label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px
}
textarea,input,select,button{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px
}
textarea{
  min-height:180px;
  resize:vertical;
  font-family:monospace
}
button{
  margin-top:15px;
  background:#0f172a;
  color:white;
  border:0;
  cursor:pointer
}
button:disabled{opacity:.5}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}
#result{
  white-space:pre-wrap;
  padding:15px;
  background:#0f172a;
  color:#e2e8f0;
  border-radius:8px;
  min-height:80px
}
.success{
  color:#22c55e
}
.error{
  color:#ef4444
}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>OpenSSL AES Decrypt Checker</h1>

<p>
Masukkan payload Base64 OpenSSL yang dimulai dengan
<code>U2FsdGVkX1</code>.
</p>

<label>OpenSSL Base64</label>

<textarea id="payload"
placeholder="U2FsdGVkX1..."></textarea>

<label>Password</label>

<input
  id="password"
  type="password"
  placeholder="Masukkan password"
>

<div class="grid">

<div>
<label>Cipher</label>

<select id="cipher">
<option value="AES-256-CBC">
AES-256-CBC
</option>

<option value="AES-128-CBC">
AES-128-CBC
</option>
</select>
</div>

<div>
<label>Digest</label>

<select id="digest">
<option value="SHA-256">
SHA-256
</option>

<option value="SHA-1">
SHA-1
</option>
</select>
</div>

</div>

<button onclick="decrypt()">
DECRYPT / CHECK PASSWORD
</button>

</div>


<div class="card">

<h2>Hasil</h2>

<div id="result">
Belum ada pemeriksaan.
</div>

</div>

</div>


<script>

function base64ToBytes(base64){

    base64=base64
        .replace(/\s/g,"");

    const binary=
        atob(base64);

    const bytes=
        new Uint8Array(
            binary.length
        );

    for(
        let i=0;
        i<binary.length;
        i++
    ){

        bytes[i]=
            binary.charCodeAt(i);

    }

    return bytes;

}


function stringBytes(text){

    return new TextEncoder()
        .encode(text);

}


function concat(a,b){

    const result=
        new Uint8Array(
            a.length+b.length
        );

    result.set(a,0);
    result.set(b,a.length);

    return result;

}


/*
=================================
OpenSSL EVP_BytesToKey
=================================
*/

async function evpBytesToKey(
    password,
    salt,
    keyLength,
    ivLength,
    digest
){

    const passwordBytes=
        stringBytes(password);

    let previous=
        new Uint8Array(0);

    let result=
        new Uint8Array(0);

    while(
        result.length<
        keyLength+ivLength
    ){

        const input=
            concat(
                previous,
                concat(
                    passwordBytes,
                    salt
                )
            );

        previous=
            new Uint8Array(
                await crypto.subtle.digest(
                    digest,
                    input
                )
            );

        result=
            concat(
                result,
                previous
            );

    }

    return {

        key:
            result.slice(
                0,
                keyLength
            ),

        iv:
            result.slice(
                keyLength,
                keyLength+ivLength
            )

    };

}


/*
=================================
DECRYPT
=================================
*/

async function decrypt(){

    const result=
        document.getElementById(
            "result"
        );

    result.className="";
    result.textContent=
        "Memproses...";


    try{

        const base64=
            document.getElementById(
                "payload"
            ).value
            .replace(/\s/g,"");

        const password=
            document.getElementById(
                "password"
            ).value;

        const cipher=
            document.getElementById(
                "cipher"
            ).value;

        const digest=
            document.getElementById(
                "digest"
            ).value;


        if(!base64){

            throw new Error(
                "Payload Base64 kosong."
            );

        }


        if(!password){

            throw new Error(
                "Password kosong."
            );

        }


        /*
        Decode Base64
        */

        const data=
            base64ToBytes(
                base64
            );


        /*
        OpenSSL salted header
        */

        const header=
            stringBytes(
                "Salted__"
            );


        if(data.length<16){

            throw new Error(
                "Payload terlalu pendek."
            );

        }


        for(
            let i=0;
            i<8;
            i++
        ){

            if(
                data[i]!==header[i]
            ){

                throw new Error(
                    "Header Salted__ tidak ditemukan."
                );

            }

        }


        /*
        Salt = byte 8 sampai 15
        */

        const salt=
            data.slice(
                8,
                16
            );


        /*
        Ciphertext dimulai
        dari byte 16
        */

        const ciphertext=
            data.slice(
                16
            );


        /*
        AES key length
        */

        const keyLength=
            cipher==="AES-128-CBC"
            ?16
            :32;


        /*
        Derive key + IV
        */

        const derived=
            await evpBytesToKey(
                password,
                salt,
                keyLength,
                16,
                digest
            );


        /*
        Import AES key
        */

        const key=
            await crypto.subtle.importKey(
                "raw",
                derived.key,
                {
                    name:"AES-CBC"
                },
                false,
                ["decrypt"]
            );


        /*
        Decrypt
        */

        const plaintext=
            new Uint8Array(
                await crypto.subtle.decrypt(
                    {
                        name:"AES-CBC",
                        iv:derived.iv
                    },
                    key,
                    ciphertext
                )
            );


        /*
        Decode plaintext
        */

        let text;

        try{

            text=
                new TextDecoder(
                    "utf-8",
                    {
                        fatal:true
                    }
                ).decode(
                    plaintext
                );

        }
        catch{

            text=
                "[Binary data]\n\n"+
                bytesToHex(
                    plaintext
                );

        }


        result.className="success";

        result.textContent=
            "PASSWORD BENAR / DECRYPT BERHASIL\n\n"+
            "Salt:\n"+
            bytesToHex(salt)+
            "\n\n"+
            "Plaintext:\n"+
            text;


    }
    catch(error){

        result.className="error";

        result.textContent=
            "GAGAL DECRYPT\n\n"+
            error.message+
            "\n\n"+
            "Kemungkinan password atau parameter "+
            "cipher/digest tidak cocok.";

    }

}


/*
=================================
HEX
=================================
*/

function bytesToHex(bytes){

    return Array
        .from(bytes)
        .map(
            b=>
                b.toString(16)
                 .padStart(2,"0")
        )
        .join("");

}

</script>

</body>
</html>
